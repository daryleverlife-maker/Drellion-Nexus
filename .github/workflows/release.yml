name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Test
        run: pytest -q

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "DrellionNexus" --paths src src/drellion_nexus.py

      - name: Bundle FFmpeg runtime
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem "C:\\ProgramData\\chocolatey\\lib" -Filter ffmpeg.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 1000000 } | Select-Object -First 1
          if (-not $ffmpeg) { throw "Could not locate the real ffmpeg.exe." }
          $ffbin = $ffmpeg.Directory.FullName
          New-Item -ItemType Directory -Path "dist\\DrellionNexus\\bin" -Force | Out-Null
          Copy-Item "$ffbin\\ffmpeg.exe" "dist\\DrellionNexus\\bin\\ffmpeg.exe" -Force
          if (Test-Path (Join-Path $ffbin "ffprobe.exe")) { Copy-Item (Join-Path $ffbin "ffprobe.exe") "dist\\DrellionNexus\\bin\\ffprobe.exe" -Force }
          Get-ChildItem $ffbin -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "dist\\DrellionNexus\\bin\\" -Force }
          Compress-Archive -Path "dist\\DrellionNexus\\*" -DestinationPath "Drellion-Nexus-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "installer\\DrellionNexus.iss"
          if (!(Test-Path "installer-output\\Drellion-Nexus-Setup.exe")) { throw "Installer was not created." }

      - name: Generate checksums
        shell: pwsh
        run: |
          if (Test-Path "checksums.sha256") { Remove-Item "checksums.sha256" -Force }
          $files = @("Drellion-Nexus-Portable.zip", "installer-output\\Drellion-Nexus-Setup.exe")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)" | Out-File checksums.sha256 -Append -Encoding ascii
          }

      - name: Publish or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "Drellion-Nexus-Portable.zip" "installer-output\\Drellion-Nexus-Setup.exe" "checksums.sha256" --repo "${{ github.repository }}" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "Drellion-Nexus-Portable.zip" "installer-output\\Drellion-Nexus-Setup.exe" "checksums.sha256" --repo "${{ github.repository }}" --target main --title "Drellion Nexus 1.0" --notes "Drellion Nexus 1.0 Windows release. Includes the installer and portable build. The full Drellion Soundbank Pack is distributed as a separate release asset."
          }
