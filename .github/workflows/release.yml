name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "DrellionNexus" --paths src src/drellion_nexus.py
          Compress-Archive -Path dist/DrellionNexus/* -DestinationPath Drellion-Nexus-Portable.zip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\DrellionNexus.iss"'
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @("Drellion-Nexus-Portable.zip", "installer-output\Drellion-Nexus-Setup.exe")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File checksums.sha256 -Append -Encoding ascii
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "Drellion-Nexus-Portable.zip" `
            "installer-output\Drellion-Nexus-Setup.exe" `
            "checksums.sha256" `
            --title "Drellion Nexus ${{ github.ref_name }}" `
            --generate-notes
