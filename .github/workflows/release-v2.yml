name: Publish Drellion Nexus 2.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v2.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v2.0.3

    steps:
      - name: Locate latest successful 2.0 Windows build on main
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow "windows-build.yml" --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful main Windows build found."
            exit 1
          fi
          echo "Using Windows build run $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download installer, portable build, and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "Drellion-Nexus-2.0-Installer" --dir release-assets
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "Drellion-Nexus-2.0-Portable" --dir release-assets
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "Drellion-Nexus-2.0-Checksums" --dir release-assets
          test -f release-assets/Drellion-Nexus-2.0-Setup.exe
          test -f release-assets/Drellion-Nexus-2.0-Portable.zip
          test -f release-assets/checksums.sha256
          mv release-assets/Drellion-Nexus-2.0-Setup.exe release-assets/Drellion-Nexus-2.0.3-Setup.exe
          mv release-assets/Drellion-Nexus-2.0-Portable.zip release-assets/Drellion-Nexus-2.0.3-Portable.zip
          sed -i 's/Drellion-Nexus-2.0-Setup.exe/Drellion-Nexus-2.0.3-Setup.exe/g; s/Drellion-Nexus-2.0-Portable.zip/Drellion-Nexus-2.0.3-Portable.zip/g' release-assets/checksums.sha256

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Drellion Nexus 2.0.2 fixes ACE-Step generated WAV compatibility.

          Fixes:
          - Reads IEEE-float WAV (format tag 3) returned by ACE-Step.
          - Keeps normal PCM WAV support.
          - Adds regression coverage for float32 stereo WAV decoding.
          - Includes the ACE-Step 1.5 REST API compatibility fixes from 2.0.1.

          Windows assets:
          - Drellion-Nexus-2.0.3-Setup.exe
          - Drellion-Nexus-2.0.3-Portable.zip
          - checksums.sha256
          EOF

      - name: Publish Drellion Nexus 2.0.2 as Latest
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/Drellion-Nexus-2.0.3-Setup.exe release-assets/Drellion-Nexus-2.0.3-Portable.zip release-assets/checksums.sha256 --repo "${{ github.repository }}" --clobber
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --title "Drellion Nexus 2.0.2" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" release-assets/Drellion-Nexus-2.0.3-Setup.exe release-assets/Drellion-Nexus-2.0.3-Portable.zip release-assets/checksums.sha256 --repo "${{ github.repository }}" --target main --title "Drellion Nexus 2.0.2" --notes-file release-notes.md --latest
          fi
