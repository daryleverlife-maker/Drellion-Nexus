name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build Drellion Nexus EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "DrellionNexus" `
            --paths src `
            src/drellion_nexus.py

      - name: Smoke test packaged EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/DrellionNexus/DrellionNexus.exe")) { throw "DrellionNexus.exe was not created" }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DrellionNexus/* -DestinationPath Drellion-Nexus-Portable.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drellion-Nexus-Windows
          path: |
            dist/DrellionNexus/**
            Drellion-Nexus-Portable.zip
          if-no-files-found: error
