name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build Drellion Nexus EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "DrellionNexus" `
            --paths src `
            src/drellion_nexus.py

      - name: Smoke test packaged EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/DrellionNexus/DrellionNexus.exe")) { throw "DrellionNexus.exe was not created" }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DrellionNexus/* -DestinationPath Drellion-Nexus-Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\DrellionNexus.iss"
          if (!(Test-Path "installer-output\Drellion-Nexus-Setup.exe")) { throw "Installer was not created" }

      - name: Checksums
        shell: pwsh
        run: |
          $files = @("Drellion-Nexus-Portable.zip", "installer-output\Drellion-Nexus-Setup.exe")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -FilePath checksums.sha256 -Append -Encoding ascii
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drellion-Nexus-Windows
          path: |
            dist/DrellionNexus/**
            Drellion-Nexus-Portable.zip
            installer-output/Drellion-Nexus-Setup.exe
            checksums.sha256
          if-no-files-found: error
