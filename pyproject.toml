[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drellion-nexus"
version = "1.0.0a1"
description = "Vocal-first, reference-guided music creation studio"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "librosa>=0.11,<1",
  "pyloudnorm>=0.1.1,<1",
  "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.0"]

[project.scripts]
drellion-nexus = "drellion.app:main"

[tool.setuptools.packages.find]
where = ["src"]
