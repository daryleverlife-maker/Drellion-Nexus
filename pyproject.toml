[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drellion-nexus"
version = "2.0.3"
description = "Vocal-first, multi-reference AI music production studio"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "mutagen>=1.47,<2",
  "numpy>=2.3,<2.6",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.0"]
transcription = ["faster-whisper>=1.1,<2"]
separation-openunmix = ["openunmix>=1.3,<2", "torch>=2.4"]
separation-spleeter = ["spleeter>=2.4,<3"]

[project.scripts]
drellion-nexus = "drellion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
